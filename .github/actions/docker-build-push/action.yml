name: Reusable Docker build, scan and publish steps
description: Build and scan the container image before optional publication to GHCR

inputs:
  push_to_ghcr:
    description: Whether to publish the image to GHCR
    required: true
  image_name:
    description: Image name without the registry and organization
    required: true
  github_token:
    description: GitHub token used when publishing to GHCR
    required: false
  image_tags:
    description: Explicit image tags for a versioned release
    default: ''
  image_labels:
    description: Explicit OCI labels for a versioned release
    default: ''

outputs:
  digest:
    description: Immutable image digest of the published image
    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4

  - name: Extract Metadata
    id: meta
    if: ${{ inputs.image_tags == '' }}
    uses: docker/metadata-action@v6
    with:
      images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}
      tags: |
        type=sha
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
        type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}

  # Buildx reuses the scanned image's layers for publication. The local Docker
  # exporter only supports a single platform and cannot carry attestations.
  - name: Build image locally for scanning
    uses: docker/build-push-action@v7
    with:
      context: .
      platforms: linux/amd64
      push: false
      load: true
      provenance: false
      sbom: false
      tags: ${{ inputs.image_name }}:ci-scan
      labels: ${{ inputs.image_labels || steps.meta.outputs.labels }}
      cache-from: type=gha,scope=${{ inputs.image_name }}

  - name: Reject fixable high or critical image vulnerabilities
    uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
    with:
      image-ref: ${{ inputs.image_name }}:ci-scan
      format: table
      exit-code: '1'
      ignore-unfixed: true
      vuln-type: os,library
      severity: CRITICAL,HIGH

  - name: Login to GitHub Container Registry
    if: ${{ inputs.push_to_ghcr == 'true' }}
    uses: docker/login-action@v4
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ inputs.github_token }}

  - name: Build and publish Docker image
    id: build
    if: ${{ inputs.push_to_ghcr == 'true' }}
    uses: docker/build-push-action@v7
    with:
      context: .
      platforms: linux/amd64
      push: true
      tags: ${{ inputs.image_tags || steps.meta.outputs.tags }}
      labels: ${{ inputs.image_labels || steps.meta.outputs.labels }}
      # Scope the GHA cache per image so images built from this shared action
      # can't collide on one cache namespace — future-proofs against a second
      # image being added (root cause of OpenResilienceInitiative/ORISO-Admin#424).
      cache-from: type=gha,scope=${{ inputs.image_name }}
      cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}
