name: Reusable required Maven integration suite

# The complete suite is deterministic on Java 21 and is a required PreDev gate.
# Maven failures propagate directly. Reports are still summarized and uploaded
# through `always()` steps for diagnosis.

inputs:
  java_version:
    required: true

runs:
  using: 'composite'
  steps:
  - name: Set up JDK and Maven
    uses: actions/setup-java@v5
    with:
      java-version: ${{ inputs.java_version }}
      distribution: 'temurin'
      cache: maven

  - name: Run required Maven verify
    shell: bash
    run: scripts/ci/run-required-integration-tests.sh

  - name: Enforce required test reports
    if: ${{ always() }}
    shell: bash
    run: python3 scripts/ci/assert-required-test-reports.py .

  - name: Upload test reports
    if: ${{ always() }}
    uses: actions/upload-artifact@v4
    with:
      name: required-integration-test-reports-${{ inputs.java_version }}
      path: |
        **/target/surefire-reports/*.xml
        **/target/failsafe-reports/*.xml
      if-no-files-found: error
      retention-days: 7
