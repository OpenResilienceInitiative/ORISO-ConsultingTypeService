name: OpenAPI Contracts

on:
  pull_request:
  push:
    branches:
    - pre-dev

env:
  REDOCLY_VERSION: 2.40.0
  OASDIFF_VERSION: v1.17.0

jobs:
  contracts:
    name: openapi provider and consumer contracts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Checkout pull-request base
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: .contract-base

    - name: Checkout TenantService provider
      uses: actions/checkout@v6
      with:
        repository: OpenResilienceInitiative/ORISO-TenantService
        ref: pre-dev
        path: .providers/tenant

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.3'

    - name: Install pinned oasdiff
      run: |
        mkdir -p "${RUNNER_TEMP}/contract-tools"
        GOBIN="${RUNNER_TEMP}/contract-tools" go install "github.com/oasdiff/oasdiff@${OASDIFF_VERSION}"
        echo "${RUNNER_TEMP}/contract-tools" >> "${GITHUB_PATH}"

    - name: Bundle provider-owned contracts
      run: scripts/contracts/publish-provider-contracts.sh . contract-artifacts/provider

    - name: Bundle base provider contracts
      if: github.event_name == 'pull_request'
      run: scripts/contracts/publish-provider-contracts.sh .contract-base contract-artifacts/base

    - name: Reject provider breaking changes
      if: github.event_name == 'pull_request'
      run: scripts/contracts/verify-provider-compatibility.sh contract-artifacts/base contract-artifacts/provider

    - name: Verify TenantService consumer compatibility
      run: >-
        scripts/contracts/verify-consumer-contract.sh
        services/tenantservice.yaml
        .providers/tenant
        api/tenantservice.yaml

    - name: Record resolved provider commit
      run: |
        git -C .providers/tenant rev-parse HEAD > contract-artifacts/TENANT_PROVIDER_COMMIT
        cat contract-artifacts/TENANT_PROVIDER_COMMIT

    - name: Upload immutable provider contracts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: provider-contracts-${{ github.sha }}
        path: contract-artifacts/
        if-no-files-found: error
        retention-days: 30
