name: CI - Pull Request

on:
  pull_request:

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Compile and Package Java application
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

    - name: Create Docker image
      uses: ./.github/actions/docker-build-push
      with:
        push_to_ghcr: false
        image_name: oriso-consultingtypeservice
        github_token: ${{ secrets.GITHUB_TOKEN }}

  # Non-blocking burn-in (Test Quality Audit 2026-07-04, item 3 + CI Roadmap Part 1).
  # Runs `mvnw -B verify`, which reaches the surefire `integration-tests` execution
  # (integration-test phase, **/*IT.*) — 20 IT classes / ~141 methods that have never
  # run in CI (`mvn package` stops before the integration-test phase). They use
  # embedded H2 + embedded (flapdoodle) Mongo, so no external services are needed;
  # the only network touch is flapdoodle fetching a MongoDB binary on first run.
  # continue-on-error keeps this OFF the required-checks path during burn-in.
  integration-tests:
    name: integration-tests (non-blocking, burn-in)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run integration tests (verify)
      uses: ./.github/actions/maven-verify-burnin
      with:
        java_version: '21'

  # Non-blocking OpenAPI contract diff: flags breaking changes to this service's
  # own vendored specs (api/*.yml) between the PR base and head. Informational
  # for now; flip to blocking once the process around intentional breaking
  # changes (version bump / consumer sign-off) is agreed.
  api-contract-diff:
    name: api-contract-diff (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout PR head
      uses: actions/checkout@v6

    - name: Checkout base branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.base_ref }}
        path: .base

    - name: Diff own OpenAPI specs against base (oasdiff breaking)
      shell: bash
      run: |
        shopt -s nullglob
        status=0
        for spec in api/*.yaml api/*.yml; do
          if [ -f ".base/$spec" ]; then
            echo "::group::oasdiff breaking $spec"
            docker run --rm -v "$PWD:/work:ro" tufin/oasdiff:latest \
              breaking "/work/.base/$spec" "/work/$spec" --fail-on WARN || status=1
            echo "::endgroup::"
          else
            echo "Skipping $spec (new on this branch, nothing to diff against)"
          fi
        done
        exit $status
