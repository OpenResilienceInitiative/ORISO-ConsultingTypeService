openapi: 3.0.1

info:
  title: Definition for Application Settings API
  description: This information will be replaced by the SpringFox config information
  version: 0.0.1

paths:
  /settings:
    get:
      tags:
        - applicationsettings-controller
      summary: 'Get all application settings'
      operationId: getApplicationSettings
      responses:
        200:
          description: OK - successful operation

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSettingsDTO'
        204:
          description: NO CONTENT - no content found
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /settingsadmin:
    patch:
      tags:
        - applicationsettings-controller
      summary: 'Patch application settings'
      operationId: patchApplicationSettings
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/ApplicationSettingsPatchDTO'
      responses:
        200:
          description: OK - settings saved; synchronization may remain pending
          headers:
            X-Smtp-Revision:
              schema: {type: integer, format: int64, minimum: 0}
            X-Smtp-Sync-Status:
              schema: {type: string, enum: [UNKNOWN, SMTP_SYNC_PENDING, APPLIED, DISABLED_OR_INCOMPLETE]}

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSettingsDTO'
        204:
          description: NO CONTENT - no content found
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /settingsadmin/smtp-sync-status:
    get:
      tags:
        - applicationsettings-controller
      summary: 'Read credential-free synchronization proof for saved SMTP settings'
      operationId: getSmtpSyncStatus
      security:
        - bearerAuth: []
      responses:
        200:
          description: Current metadata; UNKNOWN means no successful apply has been proved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpSynchronizationStatusDTO'
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - platform super admin required
  /settingsadmin/smtp-credentials:
    get:
      tags:
        - applicationsettings-controller
      summary: 'Get one current global SMTP transport snapshot'
      description: >-
        Returns the platform SMTP switches, transport fields, sender and decrypted credentials
        from one application-settings document. Only a platform super admin or an authorized
        technical service identity may read this response. Responses must not be cached.
      operationId: getGlobalSmtpCredentials
      security:
        - bearerAuth: []
      responses:
        200:
          description: OK - successful operation
          headers:
            X-Smtp-Revision:
              description: Revision from the same saved document as the credential snapshot
              schema: {type: integer, format: int64, minimum: 0}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSettingsSmtpCredentialsDTO'
        204:
          description: NO CONTENT - no content found
          headers:
            X-Smtp-Revision:
              schema: {type: integer, format: int64, enum: [0]}
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - insufficient permissions
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApplicationSettingsDTO:
      type: object
      required:
        - multitenancyWithSingleDomainEnabled
        - multitenancyEnabled
      properties:
        multitenancyWithSingleDomainEnabled:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        multitenancyEnabled:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        useTenantService:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        useConsultingTypesForAgencies:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        enableWalkthrough:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        disableVideoAppointments:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        mainTenantSubdomainForSingleDomainMultitenancy:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        useOverviewPage:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        calcomUrl:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        budibaseAuthClientId:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        budibaseUrl:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        calendarAppUrl:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        legalContentChangesBySingleTenantAdminsAllowed:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        documentationEnabled:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        globalFeatureSystemNotificationEmailsEnabled:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        globalSmtpEnabled:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        globalSmtpHost:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        globalSmtpPort:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        globalSmtpSecure:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        globalSmtpFrom:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        globalSmtpEmailThemeColor:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        releaseToggles:
          type: object
          additionalProperties:
            type: object


    ApplicationSettingsPatchDTO:
      type: object
      properties:
        legalContentChangesBySingleTenantAdminsAllowed:
          type: boolean
        enableWalkthrough:
          type: boolean
          description: Platform-wide master switch for product tours. Omit to leave unchanged.
        mainTenantSubdomainForSingleDomainMultitenancy:
          type: string
        globalFeatureSystemNotificationEmailsEnabled:
          type: boolean
        globalSmtpEnabled:
          type: boolean
        globalSmtpHost:
          type: string
        globalSmtpPort:
          type: string
        globalSmtpSecure:
          type: boolean
        globalSmtpUsername:
          type: string
        globalSmtpPassword:
          type: string
        globalSmtpFrom:
          type: string
        globalSmtpEmailThemeColor:
          type: string
    
    ApplicationSettingsSmtpCredentialsDTO:
      type: object
      properties:
        globalFeatureSystemNotificationEmailsEnabled:
          type: boolean
        globalSmtpEnabled:
          type: boolean
        globalSmtpHost:
          type: string
        globalSmtpPort:
          type: string
        globalSmtpSecure:
          type: boolean
        globalSmtpFrom:
          type: string
        globalSmtpEmailThemeColor:
          type: string
        globalSmtpUsername:
          type: string
        globalSmtpPassword:
          type: string

    SmtpSynchronizationStatusDTO:
      type: object
      required:
        - revision
        - status
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        appliedRevision:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        status:
          type: string
          enum: [UNKNOWN, SMTP_SYNC_PENDING, APPLIED, DISABLED_OR_INCOMPLETE]

    FeatureToggleDTO:
      type: object
      required:
        - value
        - readOnly
      properties:
        value:
          type: boolean
          example: true
        readOnly:
          type: boolean
          example: false
    SettingDTO:
      type: object
      required:
        - value
        - readOnly
      properties:
        value:
          type: string
          example: true
        readOnly:
          type: boolean
          example: false
