# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ---------------- Keycloak ----------------
# Use Kubernetes DNS names, e.g., http://keycloak.caritas.svc.cluster.local:8080
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:}
keycloak.realm=${KEYCLOAK_REALM:online-beratung}
keycloak.bearer-only=true
keycloak.resource=consulting-type-service
keycloak.principal-attribute=preferred_username
keycloak.cors=${KEYCLOAK_CORS:false}
keycloak.config.admin-username=${KEYCLOAK_CONFIG_ADMIN_USERNAME:technical}
keycloak.config.admin-password=${KEYCLOAK_CONFIG_ADMIN_PASSWORD:technical}
keycloak.config.admin-client-id=${KEYCLOAK_CONFIG_ADMIN_CLIENT_ID:admin-cli}
keycloak.config.app-client-id=${KEYCLOAK_CONFIG_APP_CLIENT_ID:app}

# ---------------- MariaDB ----------------
# Use Kubernetes DNS names, e.g., jdbc:mariadb://10.43.34.188:3306/consultingtypeservice
# NOT hardcoded IPs like jdbc:mariadb://10.43.34.188:3306/consultingtypeservice
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.idle-timeout=500000
spring.datasource.hikari.maxLifetime=500000

# ---------------- JPA Debug ----------------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------- MongoDB ----------------
# Use Kubernetes DNS names, e.g., mongodb://mongodb.caritas.svc.cluster.local:27017/consulting_types
# NOT hardcoded IPs like mongodb://10.43.61.124:27017/consulting_types
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:}

# ---------------- Liquibase ----------------
# Re-enabled with a single master changelog for all environments
# (Liquibase Re-Enablement Plan 2026-07-04, package L1).
# SPRING_LIQUIBASE_ENABLED is the emergency kill switch (defaults to true).
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog/consultingtypeservice-master.xml
spring.liquibase.contexts=seed

# ---------------- Server ----------------
server.port=8083

# ---------------- Local App Settings ----------------
app.base.url=${APP_BASE_URL:http://localhost:8083}

# Multitenancy
multitenancy.enabled=${MULTITENANCY_ENABLED:false}
tenant.service.api.url=${TENANT_SERVICE_API_URL:}
feature.multitenancy.with.single.domain.enabled=${FEATURE_MULTITENANCY_WITH_SINGLE_DOMAIN_ENABLED:true}
setting.main.tenant.subdomain.for.single.domain.multitenancy=${SETTING_MAIN_TENANT_SUBDOMAIN_FOR_SINGLE_DOMAIN_MULTITENANCY:localhost}

debug=true

consulting.types.json.path=consulting-type-settings
keycloak.ssl-required=none
