# ---------------- General ----------------
spring.application.name=consulting-type-service
app.base.url=${APP_BASE_URL:http://localhost:8083}
spring.profiles.active=local

# ---------------- MariaDB ----------------
# Configuration must be provided via ConfigMap/Secrets (environment variables)
# Use Kubernetes DNS names, e.g., jdbc:mariadb://mariadb.caritas.svc.cluster.local:3306/consultingtypeservice
# NOT hardcoded IPs like jdbc:mariadb://10.43.123.72:3306/consultingtypeservice
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.idle-timeout=500000
spring.datasource.hikari.maxLifetime=500000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate

# ---------------- Liquibase ----------------
# Re-enabled with a single master changelog for all environments
# (Liquibase Re-Enablement Plan 2026-07-04, package L1).
# SPRING_LIQUIBASE_ENABLED is the emergency kill switch (defaults to true).
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog/consultingtypeservice-master.xml
spring.liquibase.contexts=${SPRING_LIQUIBASE_CONTEXTS:prod}
spring.main.allow-bean-definition-overriding=true
spring.jpa.open-in-view=false
spring.data.jpa.repositories.bootstrap-mode=default
spring.jpa.properties.hibernate.ejb.interceptor=de.caritas.cob.consultingtypeservice.api.service.TenantHibernateInterceptor

# ---------------- Server ----------------
server.port=8083
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.web.locale=de_DE
spring.jackson.time-zone=Europe/Berlin
spring.mustache.enable=false
spring.mustache.cache=false
spring.mustache.check-template-location=false

# ---------------- Logging ----------------
# JSON structured logging is configured in logback-spring.xml (console/stdout
# only). Container stdout is what SigNoz's log agent collects; the previous
# file-based log (log/consultingtypeservice.log) was redundant for
# observability and had no Helm volume mount depending on it, so it was
# dropped in favor of console-only logging (mirrors ORISO-UserService).

# ---------------- Springfox / API docs ----------------
springfox.docuTitle=Caritas Online Beratung: ConsultingTypeService
springfox.docuDescription=Provides a REST API service to provide user information and actions.
springfox.docuVersion=0.0.1
springfox.docuLicense=Apache 2.0
springfox.docuLicenseUrl=http://www.apache.org/licenses/LICENSE-2.0.html
springfox.docuPath=/consultingtypes/docs

# ---------------- Consulting type JSON ----------------
consulting.types.json.path=consulting-type-settings
consulting.types.json.schema.file=/schemas/consulting-type.json

# ---------------- CSRF ----------------
csrf.header.property=X-CSRF-Token
csrf.cookie.property=CSRF-TOKEN

# ---------------- Application settings ----------------
# 32-byte AES key (Base64) or passphrase; env: SETTINGS_SMTP_PASSWORD_ENCRYPTION_SECRET
settings.smtp.password.encryption.secret=${SETTINGS_SMTP_PASSWORD_ENCRYPTION_SECRET:}
dpa.sign.frontend.base-url=${DPA_SIGN_FRONTEND_BASE_URL:https://app.oriso.org}

# ---------------- E-mail brand (ADR-021) ----------------
# Same property names as UserService's OrisoEmailBrand, so both services take the same env vars.
email.brand.platform-name=${EMAIL_BRAND_PLATFORM_NAME:Online-Beratung}
email.brand.org-name=${EMAIL_BRAND_ORG_NAME:ORISO}
email.brand.org-address=${EMAIL_BRAND_ORG_ADDRESS:}
email.brand.contact-line=${EMAIL_BRAND_CONTACT_LINE:}
email.brand.logo-url=${EMAIL_BRAND_LOGO_URL:}

# ---------------- Cache ----------------
cache.tenant.configuration.maxEntriesLocalHeap=100
cache.tenant.configuration.eternal=false
cache.tenant.configuration.timeToIdleSeconds=0
cache.tenant.configuration.timeToLiveSeconds=86400

cache.groups.configuration.maxEntriesLocalHeap=100
cache.groups.configuration.eternal=false
cache.groups.configuration.timeToIdleSeconds=0
cache.groups.configuration.timeToLiveSeconds=900

# ---------------- MongoDB ----------------
# Use Kubernetes DNS names, e.g., mongodb://mongodb.caritas.svc.cluster.local:27017/consulting_types?retryWrites=false
# NOT hardcoded IPs like mongodb://10.43.61.124:27017/consulting_types
# NOTE (Spring Boot 4): the Mongo config property was renamed from `spring.data.mongodb.uri`
# to `spring.mongodb.uri` (spring.data.mongodb.* is deprecation level=error since 4.0.0 and is
# NO LONGER bound). Using the old key silently dropped the URI and fell back to localhost:27017,
# crashlooping the pod. The env var name (SPRING_DATA_MONGODB_URI, set by the ConfigMap) is kept.
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:}

# ---------------- JWT Security ----------------
# Use Kubernetes DNS names, e.g., http://keycloak.caritas.svc.cluster.local:8080/realms/online-beratung
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:}

# ---------------- Keycloak ----------------
# Use Kubernetes DNS names, e.g., http://keycloak.caritas.svc.cluster.local:8080
# NOT hardcoded IPs like http://10.43.63.186:8080
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:}
keycloak.realm=${KEYCLOAK_REALM:}
keycloak.bearer-only=true
keycloak.resource=consulting-type-service
keycloak.principal-attribute=preferred_username
keycloak.cors=${KEYCLOAK_CORS:true}

consulting.type.cors.enabled=${CONSULTING_TYPE_CORS_ENABLED:false}
consulting.type.cors.allowed.origins=${CONSULTING_TYPE_CORS_ALLOWED_ORIGINS:}
consulting.type.cors.allowed.paths=${CONSULTING_TYPE_CORS_ALLOWED_PATHS:/**}

# ---------------- Multitenancy ----------------

# Multitenancy
multitenancy.enabled=${MULTITENANCY_ENABLED:false}
# Use Kubernetes DNS names, e.g., http://tenantservice.caritas.svc.cluster.local:8081
tenant.service.api.url=${TENANT_SERVICE_API_URL:}
feature.multitenancy.with.single.domain.enabled=${FEATURE_MULTITENANCY_WITH_SINGLE_DOMAIN_ENABLED:false}
setting.main.tenant.subdomain.for.single.domain.multitenancy=${SETTING_MAIN_TENANT_SUBDOMAIN_FOR_SINGLE_DOMAIN_MULTITENANCY:app}

# ---------------- Management / Health ----------------
management.endpoint.health.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true

# ---------------- Distributed tracing / metrics (SigNoz via OTLP) ----------------
# Traces and metrics ship via OTLP to the SigNoz gateway collector (logs already
# flow separately via stdout JSON, see logback-spring.xml). Endpoints are
# env-driven: empty by default until ORISO-Helm sets the env vars per
# environment. Previously this service force-
# disabled tracing (management.tracing.enabled=false, itself a deprecated/
# unbound property since Boot 4.0 - see management.tracing.export.enabled)
# alongside a dead Zipkin exporter target (localhost:9411, no collector ever
# ran).
#
# Property names verified against the actual Spring Boot 4.0.1 classes
# (OtlpTracingProperties / OtlpMetricsProperties / ConditionalOnEnabled*):
# - Tracing OTLP config lives under management.opentelemetry.tracing.export.otlp.*
#   (NOT management.otlp.tracing.*, which doesn't exist and would silently
#   bind nothing).
# - Each OTLP exporter is independently gated by its own *.enabled property
#   (management.tracing.export.otlp.enabled / management.otlp.metrics.export.enabled),
#   which both default to true if unset - so an empty endpoint alone does NOT
#   disable the exporter. Both default to false here until ORISO-Helm turns
#   them on with a real endpoint.
# Root sampler probability (management.tracing.sampling.*, bound by
# TracingProperties.Sampling in Boot 4.0.1). Left unset, this defaults to
# 0.10f (10%) - not "disabled", just quiet: on services with low request
# volume (this one, unlike AgencyService, isn't hit by constant kube-probe
# traffic) a handful of manual health-check requests can easily produce zero
# sampled traces purely by chance, which looks identical to "tracing is
# broken" from the ClickHouse side. Made explicit and env-driven, matching
# TenantService's existing (previously inert, now live) sampling override, so
# Pre-Dev/dev observability doesn't depend on request volume.
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:}
management.tracing.export.otlp.enabled=${MANAGEMENT_OTLP_TRACING_ENABLED:false}
management.otlp.metrics.export.url=${MANAGEMENT_OTLP_METRICS_EXPORT_URL:}
management.otlp.metrics.export.enabled=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
# spring-boot-opentelemetry (pulled in for the base OpenTelemetry SDK bean,
# see pom.xml) ships its own OTLP *logging* exporter, enabled by default and
# unrelated to this service's actual logging setup (JSON via logback-spring.xml
# to stdout, collected by SigNoz's log agent). Left on, it would build a
# competing OTel log pipeline with its own periodic export timer - the exact
# kind of silent phantom exporter this whole package removes for tracing.
# Hard-disabled, not env-driven: this is not a supported feature here.
management.logging.export.otlp.enabled=false
