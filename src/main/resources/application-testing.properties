# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# ---------------- Keycloak ----------------
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:testing}
keycloak.bearer-only=true
keycloak.resource=consulting-type-service
keycloak.principal-attribute=preferred_username
keycloak.cors=false
keycloak.config.admin-username=${KEYCLOAK_CONFIG_ADMIN_USERNAME:test-admin}
keycloak.config.admin-password=${KEYCLOAK_CONFIG_ADMIN_PASSWORD:test-password}
keycloak.config.admin-client-id=admin-cli
keycloak.config.app-client-id=app

# ---------------- Test Database ----------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:consultingtypeservice-testing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MariaDB;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.maxLifetime=1800000

# ---------------- JPA ----------------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:database/TopicDatabase.sql

# ---------------- JWT Security ----------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/testing}

# ---------------- MongoDB ----------------
# Embedded MongoDB is auto-configured for tests via de.flapdoodle.embed.mongo.spring4x
de.flapdoodle.mongodb.embedded.version=7.0.2
# Spring Boot 4: property renamed spring.data.mongodb.uri -> spring.mongodb.uri (old key no longer bound).
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:}

# ---------------- Liquibase ----------------
spring.liquibase.enabled=false
# Database schemas are managed separately in ORISO-Database repository

# ---------------- Server ----------------
server.port=8083

# ---------------- Local App Settings ----------------
app.base.url=${APP_BASE_URL:http://localhost:8083}

# Multitenancy
multitenancy.enabled=false
tenant.service.api.url=${TENANT_SERVICE_API_URL:http://localhost:8084}
feature.multitenancy.with.single.domain.enabled=true
setting.main.tenant.subdomain.for.single.domain.multitenancy=app

# Test seed lives under src/test/resources so the "testing" profile is deterministic
# and independent of the runtime seed at the repo root (tenant-aware ITs override this).
consulting.types.json.path=src/test/resources/consulting-type-settings
keycloak.ssl-required=none
